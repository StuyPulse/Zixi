name: "Javadoc Generator"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - docs
    paths:
      - ".automation/main-push.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout docs branch
        uses: actions/checkout@v4
        with:
          ref: docs
          fetch-depth: 0

      - name: Parse JSON to readable string
        id: format_metadata
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const rawFile = fs.readFileSync(".automation/main-push.json", "utf-8");
            const metadata = JSON.parse(rawFile);

            const shortHash = metadata.hash.substring(0, 7);

            const splitMessage = metadata.message.split("\n");
            let message = splitMessage[0];
            if (splitMessage.length > 1) {
              message += "...";
            }

            const formatTimestamp = (timestamp) => {
              if (!timestamp || timestamp === "unknown") {
                return "unknown";
              }

              return new Date(timestamp).toLocaleString("en-US", {
                month: "short",
                day: "numeric",
                year: "numeric",
                hour: "numeric",
                minute: "2-digit",
                hour12: true,
                timeZone: "America/New_York"
              });
            }

            const commitTimestamp = formatTimestamp(metadata.commitTimestamp);
            const triggerTimestamp = formatTimestamp(metadata.triggerTimestamp);

            const formatted = [
              `For commit ${shortHash}`,
              `Message: ${message}`,
              `Commit timestamp: ${commitTimestamp}`,
              `Trigger timestamp: ${triggerTimestamp}`,
              `Trigger type: ${metadata.manuallyTriggered ? "Manually triggered" : "Push to main"}`
            ].join("\n");

            core.setOutput("push_metadata", formatted);

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Checkout main
        run: |
          git fetch origin main
          git checkout main

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Generate Javadocs
        run: ./gradlew javadoc

      - name: Return to docs branch
        run: |
          git reset --hard
          git checkout docs

      - name: Install npm dependencies
        run: npm ci

      - name: Patch Javadocs
        run: npm run patch

      - name: Copy generated Javadocs
        run: cp -r build/docs/javadoc/. docs/

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/

          if ! git diff --cached --quiet; then
            git commit -m "docs: automated documentation update" \
              -m "${{ steps.format_metadata.outputs.push_metadata }}"
            git push origin docs
          else
            echo "No changes to commit"
          fi
